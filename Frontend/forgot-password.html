<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Kenova</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <main class="auth-page">
    <form class="auth-card" id="forgotForm" novalidate>

      <a class="logo" href="home.html">KENOVA</a>
      <h1>Forgot Password</h1>

      <p style="text-align:center;color:var(--gray);font-size:.9rem;margin:-4px 0 6px">
        Enter the email or phone number you registered with — we'll send you a reset link.
      </p>

      <!-- Email or Phone -->
      <label for="identifier" class="sr-only">Email or Phone</label>
      <div class="input-wrap">
        <i class="fa-solid fa-user input-icon"></i>
        <input
          id="identifier"
          type="text"
          name="identifier"
          placeholder="Email or Phone"
          autocomplete="username"
          required>
      </div>

      <!-- Submit -->
      <button class="btn" type="submit">Send reset link</button>

      <!-- Messages -->
      <p class="form_error" id="forgotError" hidden></p>
      <p class="form_success" id="forgotSuccess" hidden></p>

      <!-- Back to login -->
      <p class="auth_alt">
        Remembered it? <a href="login.html">Back to Login</a>
      </p>

    </form>
  </main>

  <script src="forgot-password.js"></script>

</body>

</html>
