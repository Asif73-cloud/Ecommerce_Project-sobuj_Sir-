<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shopping Cart - Kenova</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="cart-sidebar.css">
</head>

<body>

    <aside class="cart-panel" aria-label="Shopping cart">

        <!-- Header -->
        <div class="cart-panel-header">
            <div class="cart-panel-header-left">
                <span class="cart-panel-icon">
                    <i class="fa-solid fa-bag-shopping"></i>
                </span>
                <div>
                    <h2>Shopping Cart</h2>
                    <p class="cart-panel-count"><span id="cartItemCount">1</span> item</p>
                </div>
            </div>
            <button type="button" class="cart-panel-close" id="closeCart" aria-label="Close cart">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Body -->
        <div class="cart-panel-body" id="cartItems">

            <article class="cart-item" data-id="1" data-price="1140" data-old-price="1700">
                <div class="cart-item-media">
                    <span class="cart-item-discount">-33%</span>
                    <img src="https://images.unsplash.com/photo-1621607512214-68297480165e?w=200&h=200&fit=crop"
                        alt="Xiaomi Enchen Boost Trimmer">
                </div>

                <div class="cart-item-info">
                    <h3 class="cart-item-title">Xiaomi Enchen Boost Trimmer</h3>
                    <p class="cart-item-sku">SKU: WOO-32812</p>

                    <div class="cart-item-price-row">
                        <span class="cart-item-price">৳1,140.00</span>
                        <span class="cart-item-old">৳1,700.00</span>
                    </div>

                    <div class="cart-item-controls">
                        <div class="qty">
                            <button type="button" class="qty-btn" data-action="dec" aria-label="Decrease">−</button>
                            <input type="text" class="qty-value" value="1" readonly>
                            <button type="button" class="qty-btn" data-action="inc" aria-label="Increase">+</button>
                        </div>
                        <button type="button" class="cart-item-remove" aria-label="Remove item">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </div>
                </div>

                <div class="cart-item-total">
                    <span class="cart-item-total-price">৳1,140.00</span>
                    <span class="cart-item-saved">Saved ৳560.00</span>
                </div>
            </article>

        </div>

        <!-- Footer -->
        <div class="cart-panel-footer">

            <div class="cart-row cart-row-savings">
                <span>Total Savings</span>
                <span id="cartSavings">-৳560.00</span>
            </div>

            <div class="cart-row cart-row-total">
                <span>Total</span>
                <span id="cartTotal">৳1,140.00</span>
            </div>

            <a href="checkout.html" class="cart-checkout">
                Proceed to Checkout <i class="fa-solid fa-arrow-right"></i>
            </a>

            <a href="home.html" class="cart-continue" id="continueShopping">Continue Shopping</a>

        </div>

    </aside>

    <script src="cart-sidebar.js"></script>

</body>

</html>
