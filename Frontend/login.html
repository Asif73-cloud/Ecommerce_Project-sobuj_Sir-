 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | Kenova</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <main class="auth-page">
    <form class="auth-card" id="loginForm" novalidate>

      <a href="home.html" class="logo">KENOVA</a>
      <h1>Welcome Back</h1>

      <!-- Email -->
      <div class="input-wrap">
        <i class="fa-regular fa-envelope input-icon"></i>
        <input type="text" id="loginEmail" placeholder="Email or Phone" autocomplete="username" required>
      </div>

      <!-- Password -->
      <div class="input-wrap">
        <i class="fa-solid fa-lock input-icon"></i>
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
        <button type="button" class="toggle-pass" aria-label="Show password">
          <i class="fa-regular fa-eye"></i>
        </button>
      </div>

      <!-- Remember + Forgot -->
      <div class="row_between">
        <label class="check">
          <input type="checkbox" id="rememberMe">
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn" id="loginBtn">Sign In</button>

      <!-- Error / Success messages -->
      <div class="form_error" id="formError" hidden></div>
      <div class="form_success" id="formSuccess" hidden></div>

      <!-- Alternate link -->
      <p class="auth_alt">
        Don't have an account? <a href="register.html">Create one</a>
      </p>

    </form>
  </main>

  <!-- ✅ Script order -->
  <script src="api.js"></script>
  <script src="login.js"></script>

</body>
</html>
